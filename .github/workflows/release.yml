name: Build release image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Verify source
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          python -m pip install -r requirements.txt
          python tests/test_scan_scope.py
          python tests/test_monitoring_privacy.py
          python tests/test_core.py
          node --check web/static/app.js
      - name: Build Linux amd64 image
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/scanner-build"
          mkdir -p "$build_dir/source"
          git archive HEAD | tar -x -C "$build_dir/source"
          cp deployment/.dockerignore "$build_dir/.dockerignore"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "spacedo-scanner:$RELEASE_TAG" -f deployment/Dockerfile.production "$build_dir"
          docker run --rm "spacedo-scanner:$RELEASE_TAG" python tests/test_scan_scope.py
          docker run --rm "spacedo-scanner:$RELEASE_TAG" python tests/test_monitoring_privacy.py
          docker run --rm "spacedo-scanner:$RELEASE_TAG" python tests/test_core.py
      - name: Export image and provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          docker save "spacedo-scanner:$RELEASE_TAG" | gzip -1 > "$RUNNER_TEMP/release/github-key-scanner-image-linux-amd64.tar.gz"
          export IMAGE_ID="$(docker image inspect "spacedo-scanner:$RELEASE_TAG" --format '{{.Id}}')"
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = {'tag':os.environ['RELEASE_TAG'], 'commit':os.environ['BUILD_COMMIT'],
                    'image':'spacedo-scanner:'+os.environ['RELEASE_TAG'], 'image_id':os.environ['IMAGE_ID'],
                    'platform':'linux/amd64', 'repository':os.environ['GITHUB_REPOSITORY'],
                    'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          (Path(os.environ['RUNNER_TEMP'])/'release/image-build.json').write_text(json.dumps(report,indent=2))
          PY
          cd "$RUNNER_TEMP/release"
          sha256sum github-key-scanner-image-linux-amd64.tar.gz image-build.json > IMAGE_SHA256SUMS.txt
      - name: Upload tested image to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Tested Docker image built by GitHub Actions.'
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --repo "$GITHUB_REPOSITORY" --clobber
