worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        server_name scanner.spacedo.org;

        # The existing HTTPS ingress or host cloudflared connects over loopback.
        # Preserve the original Host header at the ingress.
        if ($http_host != scanner.spacedo.org) {
            return 421;
        }

        auth_basic "Scanner";
        auth_basic_user_file /etc/nginx/scanner.htpasswd;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        client_max_body_size 1m;

        location / {
            set $scanner_upstream http://web:8765;
            proxy_pass $scanner_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_set_header Authorization "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
        }
    }
}
