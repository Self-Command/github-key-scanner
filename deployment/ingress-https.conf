# Reuses the existing host Nginx HTTPS listener; application is loopback-only.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scanner.spacedo.org;

    ssl_certificate /etc/letsencrypt/live/scanner.spacedo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanner.spacedo.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ScannerSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Reject Host headers that contain an explicit port or an unexpected hostname.
    if ($http_host != scanner.spacedo.org) {
        return 421;
    }

    access_log /var/log/nginx/scanner.access.log;
    error_log /var/log/nginx/scanner.error.log warn;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
    }
}
