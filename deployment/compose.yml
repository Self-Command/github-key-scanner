name: spacedo-scanner

x-app: &app
  image: spacedo-scanner:local
  build:
    context: .
    dockerfile: Dockerfile.production
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  volumes:
    - scanner-data:/app/data

services:
  web:
    <<: *app
    mem_limit: 256m
    pids_limit: 128
    command: ["gunicorn", "--bind", "0.0.0.0:8765", "--workers", "2", "--threads", "4", "--timeout", "90", "--access-logfile", "-", "--error-logfile", "-", "web.app:app"]
    environment:
      TZ: Asia/Shanghai
      DB_PATH: data/monitor.db
      SCAN_TRIGGER_FILE: data/scan.trigger
      SCAN_SETTINGS_FILE: data/scan-settings.json
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8765"
      SCAN_INTERVAL: ${SCAN_INTERVAL:-7200}
      SCAN_INCREMENTAL: ${SCAN_INCREMENTAL:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/status',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  daemon:
    <<: *app
    mem_limit: 768m
    pids_limit: 128
    profiles: ["scanner"]
    command: ["python", "-u", "main.py", "daemon"]
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      DB_PATH: data/monitor.db
      SCAN_TRIGGER_FILE: data/scan.trigger
      SCAN_SETTINGS_FILE: data/scan-settings.json

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    mem_limit: 128m
    pids_limit: 128
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_PORT:-18080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/scanner.htpasswd:/etc/nginx/scanner.htpasswd:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  scanner-data:
