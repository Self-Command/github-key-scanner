# Reuses the existing host Nginx HTTP listener; no new proxy process or socket.
server {
    listen 80;
    listen [::]:80;
    server_name scanner.spacedo.org;

    if ($http_host != scanner.spacedo.org) {
        return 421;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/scanner-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://scanner.spacedo.org$request_uri;
    }
}
